services:
  postgres:
    image: postgres:16-alpine
    container_name: reforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: reforge
      POSTGRES_PASSWORD: reforge
      POSTGRES_DB: reforge
    ports:
      # Host port 5433 (not 5432): dev machines commonly run a native
      # PostgreSQL on 5432, and Windows allows both to bind at once —
      # connections then race between the two servers and auth fails
      # intermittently. Container port stays 5432; DATABASE_URL uses 5433.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reforge -d reforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: reforge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
